version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telecomm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-telecomm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telecomm}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-telecomm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-telecomm}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SECRET: ${AUTH_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      POSTMARK_INBOUND_ADDRESS: ${POSTMARK_INBOUND_ADDRESS:-}
      POSTMARK_WEBHOOK_USER: ${POSTMARK_WEBHOOK_USER:-}
      POSTMARK_WEBHOOK_PASS: ${POSTMARK_WEBHOOK_PASS:-}
      POSTMARK_WEBHOOK_TOKEN: ${POSTMARK_WEBHOOK_TOKEN:-}
      PORT: 4000
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      SESSION_SECRET: ${AUTH_SECRET}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
